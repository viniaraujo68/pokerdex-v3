# Pokerdex app stack. No TLS/ports here — the shared edge proxy (deploy/edge)
# fronts it on port 80, and Cloudflare provides HTTPS. Both services join the
# external "web" network so the edge can reach them by alias.
# Create the network once:  docker network create web
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POKERDEX_DATABASE_URL: sqlite:////data/pokerdex.db
      POKERDEX_COOKIE_SECURE: "true"
      POKERDEX_CORS_ORIGINS: ""
      POKERDEX_SESSION_TTL_DAYS: "30"
    volumes:
      - pokerdex_data:/data
    networks:
      web:
        aliases:
          - pokerdex-backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      ORIGIN: https://${POKERDEX_DOMAIN:-pokerdex.rastrovin.org}
    depends_on:
      - backend
    networks:
      web:
        aliases:
          - pokerdex-frontend

networks:
  web:
    external: true

volumes:
  pokerdex_data:
