# Pokerdex app stack. No TLS/ports here — the shared edge proxy (github.com/viniaraujo68/edge)
# fronts it behind a Cloudflare Tunnel, using its sites/pokerdex.caddy. Both services join the
# external "web" network so the edge can reach them by alias.
# Create the network once:  docker network create web
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POKERDEX_DATABASE_URL: postgresql+psycopg2://pokerdex:${POKERDEX_DB_PASSWORD}@postgres:5432/pokerdex
      POKERDEX_COOKIE_SECURE: "true"
      POKERDEX_CORS_ORIGINS: ""
      POKERDEX_SESSION_TTL_DAYS: "30"
    networks:
      web:
        aliases:
          - pokerdex-backend
      data:

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      ORIGIN: https://${POKERDEX_DOMAIN:-pokerdex.rastrovin.org}
      # The server-rendered public pages (/g/<slug>, /explorar) fetch the API from inside the
      # network: for them "/api" is not same-origin, since this container serves only the app.
      # The browser keeps using /api through the edge proxy.
      POKERDEX_API_INTERNAL_URL: http://backend:8000
      # Teaches adapter-node where the visitor's IP lives, which is what
      # event.getClientAddress() returns. hooks.server.js passes that on as X-Forwarded-For
      # on the internal /api calls, so the backend rate-limits per visitor instead of
      # lumping every server-rendered page view into the frontend container's one bucket.
      ADDRESS_HEADER: x-forwarded-for
      # Depth counted from the *right* of the chain. The edge overwrites X-Forwarded-For with a
      # single value, the visitor IP it read from Cloudflare's Cf-Connecting-IP
      # (sites/pokerdex.caddy in the edge repo), so 1 is the correct (and the un-spoofable) choice.
      XFF_DEPTH: "1"
    depends_on:
      - backend
    networks:
      web:
        aliases:
          - pokerdex-frontend

networks:
  web:
    external: true
  data:
    external: true
