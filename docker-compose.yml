services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POKERDEX_DATABASE_URL: sqlite:////data/pokerdex.db
      POKERDEX_COOKIE_SECURE: "true"
      POKERDEX_CORS_ORIGINS: ""
      POKERDEX_SESSION_TTL_DAYS: "30"
    volumes:
      - pokerdex_data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pokerdex_data:
  caddy_data:
  caddy_config:
