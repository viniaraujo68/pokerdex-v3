[pytest]
testpaths = tests
addopts = -ra
markers =
    timing: wall-clock sensitive (argon2 timing equalization); can be flaky on a loaded
        machine or under coverage. Deselect with: -m "not timing"
    ratelimit: drives the slowapi counters; mutates global limiter state, so these tests
        enable/reset the limiter around themselves and must not run in parallel.
