[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.16+ warns when this is absent and falls back to splitting `prepend_sys_path` on
# spaces/commas/colons. `os` means "use the platform's path separator" — the modern default,
# and the single entry above is unaffected either way.
path_separator = os

# NOTE: there is deliberately no `sqlalchemy.url` here. alembic/env.py sets it from
# app.config.settings.database_url (POKERDEX_DATABASE_URL), so the CLI and the app
# startup migration always target the same database. Hardcoding it here would silently
# migrate the wrong file in Docker, where the DB lives on /data.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
